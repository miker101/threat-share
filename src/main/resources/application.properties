spring.application.name=threatshare-backend

spring.datasource.url=jdbc:mysql://localhost:3306/threatshare_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

threatshare.jwt.secret=${THREATSHARE_JWT_SECRET}
threatshare.jwt.expiration-ms=3600000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Cryptographic Key Storage
threatshare.crypto.keystore.path=${THREATSHARE_KEYSTORE_PATH}
threatshare.crypto.keystore.password=${THREATSHARE_KEYSTORE_PASSWORD}
threatshare.crypto.keystore.type=PKCS12

# ==========================================
# THREATSHARE SYSTEM HEALTH MONITORING
# ==========================================

# Expose required monitoring endpoints
management.endpoints.web.exposure.include=health,info,metrics

# Show detailed health information
management.endpoint.health.show-details=when-authorized

# Enable database health monitoring
management.health.db.enabled=true

# Application information
management.info.env.enabled=true

info.app.name=ThreatShare
info.app.description=Secure Threat Intelligence Sharing Platform
info.app.version=1.0.0